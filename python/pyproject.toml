[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "tlsprint-python"
version = "0.1.1"
description = "Python HTTP client with tlsprint's Go TLS and HTTP/2 fingerprint engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tlsprint = ["py.typed"]

[tool.cibuildwheel]
# The shared-library ABI is independent of CPython. Build once per platform;
# cibuildwheel reuses the py3-none wheel when testing the second interpreter.
build = "cp310-* cp314-*"
skip = "*-musllinux_*"
archs = ["native"]
test-command = "python {package}/tools/test_wheel.py"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
before-all = "python {package}/tools/install_linux_go.py"
environment = { PATH = "/opt/tlsprint-toolchain/go/bin:$PATH" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair --analyze-existing --wheel-dir {dest_dir} {wheel}"
