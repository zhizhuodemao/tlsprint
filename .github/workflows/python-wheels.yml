name: Python wheels

on:
  workflow_dispatch:
  push:
    paths:
      - 'python/**'
      - 'client/**'
      - 'utls/**'
      - 'http2/**'
      - 'preset/**'
      - '.github/workflows/python-wheels.yml'

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            builds: 'cp310-manylinux* cp314-manylinux* cp310-musllinux* cp314-musllinux*'
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            builds: 'cp310-manylinux* cp314-manylinux* cp310-musllinux* cp314-musllinux*'
          - name: macos-x86_64
            os: macos-15-intel
            builds: 'cp310-* cp314-*'
          - name: macos-arm64
            os: macos-15
            builds: 'cp310-* cp314-*'
          - name: windows-x64
            os: windows-2022
            builds: 'cp310-* cp314-*'
          - name: windows-arm64
            os: windows-11-arm
            builds: 'cp311-* cp314-*'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        if: runner.os != 'Linux'
        with:
          go-version: '1.24.13'
          cache-dependency-path: python/native/go.sum
      - name: Install Windows C compiler
        if: runner.os == 'Windows'
        run: python python/tools/install_windows_compiler.py
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.builds }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --sdist python --outdir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: wheelhouse/*.tar.gz
          if-no-files-found: error
